# Сборка пакетов роутера (dpishell, luci-app-dpishell) официальным OpenWRT SDK и подписанная витрина пакетов на GitHub Pages.
# Пакеты не зависят от архитектуры (PKGARCH:=all) — один SDK x86-64 собирает их для любого роутера.
# Подпись: SDK подписывает индекс packages.adb ключом из секрета APK_SIGNING_KEY; открытый ключ — router/keys/dpishell.pem.
# Релиз: тег router-vX.Y.Z (версия = PKG_VERSION = VERSION в state.uc) → релиз GitHub с пакетами и release.json;
# release.json.sig — ed25519 над байтами release.json, ключ из секрета RELEASE_SIGNING_KEY (router-api.md §5).
# Тот же сайт Pages раздаёт данные программы для Windows: site/data/ = data/ из master + data.json.sig
# (подпись манифеста тем же ключом, docs/dev/building.md «Подписи»). Pages — один сайт на репозиторий,
# поэтому фид и данные выкладываются одной сборкой (job site), атомарно: data.json и подпись не расходятся.
name: router-packages

on:
  push:
    branches: [ master ]
    tags: [ 'router-v*' ]
    # Для тегов фильтр путей GitHub не применяет — релиз собирается всегда.
    paths: [ 'router/**', 'data/**', 'packaging/keys/**', '.github/workflows/router.yml' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: router-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: openwrt/sdk:x86-64-v25.12.5
      options: --user root
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # release.json: изменения с прошлого тега router-v*

      - name: Порядок объявлений функций ucode
        run: python3 router/tools/check-order.py

      - name: Пакеты в дерево SDK, данные из data/
        run: |
          SDK=/builder
          rm -rf $SDK/package/dpishell $SDK/package/luci-app-dpishell
          cp -r router/dpishell router/luci-app-dpishell $SDK/package/
          D=$SDK/package/dpishell/files/usr/share/dpishell
          mkdir -p $D/lists $D/fake
          cp data/strategies.json data/targets.json $D/
          cp data/lists/*.txt $D/lists/
          cp data/fake/*.bin $D/fake/

      - name: Ключ подписи индекса
        env:
          APK_SIGNING_KEY: ${{ secrets.APK_SIGNING_KEY }}
        run: |
          printf '%s\n' "$APK_SIGNING_KEY" > /builder/private-key.pem
          chmod 600 /builder/private-key.pem
          cp router/keys/dpishell.pem /builder/public-key.pem
          # Открытый ключ из репозитория должен соответствовать секрету — иначе роутер отвергнет индекс.
          openssl ec -in /builder/private-key.pem -pubout 2>/dev/null | cmp -s - router/keys/dpishell.pem \
            || { echo 'ключ в секрете не соответствует router/keys/dpishell.pem'; exit 1; }

      - name: Сборка и подписанный индекс
        working-directory: /builder
        env:
          FORCE_UNSAFE_CONFIGURE: 1
        run: |
          make defconfig >/dev/null
          echo CONFIG_SIGNED_PACKAGES=y >> .config
          make package/dpishell/compile V=s
          make package/luci-app-dpishell/compile V=s
          FEED=$GITHUB_WORKSPACE/site/feed
          mkdir -p $FEED
          find bin -name '*dpishell*.apk' -exec cp {} $FEED/ \;
          # Индекс только наших пакетов, подписанный ключом.
          ./staging_dir/host/bin/apk mkndx --allow-untrusted --sign private-key.pem --output $FEED/packages.adb $FEED/*.apk
          # --keys-dir apk считает от корня (--root, по умолчанию /), поэтому путь абсолютный; в каталоге — только открытый ключ.
          mkdir -p /builder/verify-keys && cp $GITHUB_WORKSPACE/router/keys/dpishell.pem /builder/verify-keys/
          ./staging_dir/host/bin/apk verify --keys-dir /builder/verify-keys $FEED/packages.adb || { echo 'подпись индекса не прошла проверку'; exit 1; }
          cp $GITHUB_WORKSPACE/router/keys/dpishell.pem $FEED/dpishell.pem
          cd $FEED && sha256sum *.apk packages.adb > sha256sums.txt && cat sha256sums.txt
          rm -f /builder/private-key.pem

      - name: release.json и сверка версий
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/router-v') && github.ref_name || '' }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 router/tools/release-json.py site/feed $TAG

      - uses: actions/upload-artifact@v4
        with:
          name: router-packages
          path: site/feed/

  # Сайт Pages: фид пакетов из build + данные программы для Windows с подписью манифеста.
  site:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: router-packages
          path: site/feed

      - name: Данные и подпись data.json
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          mkdir -p site/data
          cp -r data/. site/data/
          rm -f site/data/data.json.sig
          if [ -z "$RELEASE_SIGNING_KEY" ]; then echo '::warning::нет секрета RELEASE_SIGNING_KEY — данные без data.json.sig'; exit 0; fi
          printf '%s\n' "$RELEASE_SIGNING_KEY" > key.pem
          chmod 600 key.pem
          # Секрет должен соответствовать проверочному ключу, зашитому в программу (packaging/keys/release-ed25519.pem).
          openssl pkey -in key.pem -pubout > secret.pub
          openssl pkey -pubin -in packaging/keys/release-ed25519.pem -pubout | cmp -s - secret.pub \
            || { rm -f key.pem; echo 'ключ в секрете не соответствует packaging/keys/release-ed25519.pem'; exit 1; }
          openssl pkeyutl -sign -inkey key.pem -rawin -in site/data/data.json | base64 -w0 > site/data/data.json.sig
          rm -f key.pem secret.pub
          base64 -d site/data/data.json.sig > sig.bin
          openssl pkeyutl -verify -pubin -inkey packaging/keys/release-ed25519.pem -rawin -in site/data/data.json -sigfile sig.bin \
            || { echo 'подпись data.json не прошла проверку'; exit 1; }
          rm -f sig.bin

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  pages:
    if: github.ref == 'refs/heads/master'
    needs: site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    if: startsWith(github.ref, 'refs/tags/router-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: packaging/keys

      - uses: actions/download-artifact@v4
        with:
          name: router-packages
          path: feed

      - name: Подпись release.json
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then echo '::warning::нет секрета RELEASE_SIGNING_KEY — релиз без release.json.sig'; exit 0; fi
          printf '%s\n' "$RELEASE_SIGNING_KEY" > key.pem
          chmod 600 key.pem
          # Секрет должен соответствовать проверочному ключу программы (packaging/keys/release-ed25519.pem).
          openssl pkey -in key.pem -pubout > secret.pub
          openssl pkey -pubin -in packaging/keys/release-ed25519.pem -pubout | cmp -s - secret.pub \
            || { rm -f key.pem; echo 'ключ в секрете не соответствует packaging/keys/release-ed25519.pem'; exit 1; }
          openssl pkeyutl -sign -inkey key.pem -rawin -in feed/release.json | base64 -w0 > feed/release.json.sig
          rm -f key.pem secret.pub

      - name: Релиз GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c "import json;d=json.load(open('feed/release.json',encoding='utf-8'));print(chr(10).join('- '+c for c in d['changes']) or '-')" > notes.md
          files="feed/*.apk feed/release.json feed/dpishell.pem"
          [ -f feed/release.json.sig ] && files="$files feed/release.json.sig"
          # --latest=false: «последний» релиз репозитория — всегда программы для Windows (releases/latest/download/ — её источник обновлений).
          gh release create "$GITHUB_REF_NAME" $files --repo "$GITHUB_REPOSITORY" --latest=false --title "DpiShell для роутера ${GITHUB_REF_NAME#router-v}" --notes-file notes.md
